              <span class="color-summary-metric">新規 ${percent(row.bucket.newRate)}</span>
              <span class="color-summary-metric">既存 ${percent(row.bucket.existingRate)}</span>
              <span class="color-summary-metric">型番 ${formatNumber(row.models.length)}</span>
            </summary>
            <table class="color-model-table">
              <thead>
                <tr>
                  <th>型番</th>
                  <th>商品</th>
                  <th class="num">${escapeHtml(metricLabel())}</th>
                  <th class="num">新規</th>
                  <th class="num">既存</th>
                  <th>構成</th>
                  ${monthHeaders}
                </tr>
              </thead>
              <tbody>${modelRows}</tbody>
            </table>
          </details>
        `;
      }).join("");

      container.innerHTML = `${head}<div class="color-drill-list">${cards}</div>`;
    }

    function renderActionCell(action, options = {}) {
      if (!action || action.type === "none") {
        return options.showNone === false ? "" : `<span class="action-none">推奨なし</span>`;
      }

      const className = action.type === "recovery"
        ? "is-recovery"
        : action.type === "retention"
          ? "is-retention"
          : "";
      return `
        <div class="action-cell">
          <span class="action-badge ${className}">${escapeHtml(action.label)}</span>
          <span class="action-reason">${escapeHtml(action.reason)}</span>
        </div>
      `;
    }

    function actionCellClass(action) {
      if (!action || action.type === "none") {
        return "";
      }
      return `action-td is-${action.type}`;
    }

    function formatActionScore(score) {
      return Number(score || 0).toLocaleString("ja-JP", {
        maximumFractionDigits: 1
      });
    }

    function renderProductCell(row) {
      const product = resolveProductInfo(row.product);
      const image = product.imageUrl ? `
        <span class="product-image-box">
          <img src="${escapeHtml(product.imageUrl)}" alt="${escapeHtml(product.name || product.sku)}" loading="lazy" onerror="this.parentElement.classList.add('is-missing')">
          <span class="thumb-fallback">画像なし</span>
        </span>
      ` : `
        <span class="product-image-box is-missing">
          <span class="thumb-fallback">画像なし</span>
        </span>
      `;
      const link = product.url ? `<a class="product-link" href="${escapeHtml(product.url)}" target="_blank" rel="noopener">ECサイト</a>` : "";
      const price = product.price ? `<span class="product-price">${escapeHtml(product.price)}</span>` : "";
      return `
        <td class="product-cell">
          <div class="product-preview">
            ${image}
            <span>
              <span class="product-name">${escapeHtml(product.name || "ECサイトで確認")}</span>
              ${price}
              ${link}
            </span>
          </div>
        </td>
      `;
    }

    function renderEmpty(container, text) {
      if (container._lineChartAbort) {
        container._lineChartAbort.abort();
        container._lineChartAbort = null;
      }
      container.innerHTML = `<div class="chart-empty">${escapeHtml(text)}</div>`;
    }

    function metricLabel() {
      if (state.metric === "orders") {
        return "注文数";
      }
      if (state.metric === "rows") {
        return "明細行";
      }
      return "数量";
    }

    function formatNumber(value) {
      return Number(value || 0).toLocaleString("ja-JP", {
        maximumFractionDigits: 1
      });
    }

    function formatPercent(value, total) {
      return total > 0 ? percent(value / total) : "-";
    }

    function percent(value) {
      return `${(value * 100).toLocaleString("ja-JP", {
        maximumFractionDigits: 1
      })}%`;
    }

    function shortMonthLabel(key) {
      const [year, month] = key.split("-");
      return `${year.slice(2)}/${Number(month)}`;
    }

    function formatDateTime(date) {
      return new Intl.DateTimeFormat("ja-JP", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }

    function setMessage(text, type) {
      els.message.textContent = text;
      els.message.className = "message";
      if (type) {
        els.message.classList.add(`is-${type}`);
      }
    }

    function exportCurrentReport() {
      if (!state.records.length) {
        return;
      }
      const styles = document.getElementById("appStyles").textContent;
      const reportHtml = document.getElementById("report").outerHTML;
      const documentHtml = `<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AW注文×キャンペーン利用レポート</title>
  <style>${styles}</style>
</head>
<body>
  <main class="app exported">
    ${reportHtml.replace(" hidden", "")}
  </main>
</body>
</html>`;
      const blob = new Blob([documentHtml], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = `aw_campaign_report_${new Date().toISOString().slice(0, 10)}.html`;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      URL.revokeObjectURL(url);
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
