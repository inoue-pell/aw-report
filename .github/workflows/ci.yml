name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Record CI start
        run: echo "CI_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify merge candidate and select scope
        id: scope
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$HEAD_SHA"
          git diff --check "$BASE_SHA" HEAD
          printf '## Tested merge commit\n\n- CI_MERGE_SHA: `%s`\n- BASE_SHA: `%s`\n- HEAD_SHA: `%s`\n' \
            "$EXPECTED_SHA" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          full=false
          changed=0
          while IFS= read -r -d '' path; do
            changed=1
            case "$path" in
              *.md|docs/*|.env.example) ;;
              *) full=true ;;
            esac
          done < <(git diff --name-only --no-renames -z "$BASE_SHA" HEAD)
          test "$changed" -eq 1
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.scope.outputs.full == 'true'
        with:
          node-version: "24"
      - name: Run deterministic checks
        if: steps.scope.outputs.full == 'true'
        run: npm test
      - name: Report CI duration
        if: always()
        run: |
          elapsed=$(( $(date +%s) - CI_STARTED_AT ))
          printf '## CI duration\n\n- Elapsed: %dm %02ds\n- Target: 3m\n- Review threshold: 5m\n' \
            $((elapsed / 60)) $((elapsed % 60)) >> "$GITHUB_STEP_SUMMARY"
          if (( elapsed >= 300 )); then
            echo "::warning::CI exceeded 5 minutes; review the validation design."
          elif (( elapsed >= 180 )); then
            echo "::warning::CI exceeded the 3-minute target."
          fi
