name: Deploy GitHub Pages
run-name: AI-Work Pages ${{ inputs.release_id }} ${{ inputs.release_commit }}

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Fixed Git commit to publish
        required: true
        type: string
      release_id:
        description: AI-Work release ID
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aw-report-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assemble the static artifact
        env:
          APP_ID: aw-report
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const appId = process.env.APP_ID;
          const commit = process.env.RELEASE_COMMIT;
          if (appId !== "aw-report" || !/^[0-9a-f]{40}$/.test(commit || "")) {
            throw new Error("Release binding is invalid.");
          }
          const actualCommit = require("node:child_process")
            .execFileSync("/usr/bin/git", ["rev-parse", "HEAD"], { encoding: "utf8" })
            .trim();
          if (actualCommit !== commit) throw new Error("Checked-out commit does not match the release.");

          const manifest = JSON.parse(fs.readFileSync("pages-manifest.json", "utf8"));
          const keys = Object.keys(manifest).sort();
          if (JSON.stringify(keys) !== JSON.stringify(["paths", "schemaVersion"])) {
            throw new Error("Pages manifest fields are invalid.");
          }
          if (
            manifest.schemaVersion !== 1 ||
            !Array.isArray(manifest.paths) ||
            manifest.paths.length < 1 ||
            new Set(manifest.paths).size !== manifest.paths.length
          ) {
            throw new Error("Pages manifest is invalid.");
          }

          const root = fs.realpathSync(process.cwd());
          const output = path.join(root, "_site");
          fs.rmSync(output, { recursive: true, force: true });
          fs.mkdirSync(output, { recursive: true });

          function checkedRelative(value) {
            if (typeof value !== "string" || value === "" || value.includes("\\")) {
              throw new Error("Manifest path is invalid.");
            }
            const normalized = path.posix.normalize(value);
            const parts = normalized.split("/");
            if (
              normalized !== value ||
              normalized.startsWith("/") ||
              parts.includes("..") ||
              parts.some((part) => part === "" || part.startsWith(".")) ||
              normalized === "_site" ||
              normalized.startsWith("_site/") ||
              normalized === "release.json"
            ) {
              throw new Error("Manifest path escapes the public artifact boundary.");
            }
            return normalized;
          }

          function copyTree(source, destination) {
            const stat = fs.lstatSync(source);
            if (stat.isSymbolicLink()) throw new Error("Symlinks are not publishable.");
            if (stat.isDirectory()) {
              fs.mkdirSync(destination, { recursive: true });
              for (const name of fs.readdirSync(source).sort()) {
                copyTree(path.join(source, name), path.join(destination, name));
              }
              return;
            }
            if (!stat.isFile()) throw new Error("Only regular files are publishable.");
            fs.mkdirSync(path.dirname(destination), { recursive: true });
            fs.copyFileSync(source, destination, fs.constants.COPYFILE_EXCL);
          }

          for (const requested of manifest.paths) {
            const relative = checkedRelative(requested);
            const source = path.resolve(root, relative);
            if (source !== root && !source.startsWith(`${root}${path.sep}`)) {
              throw new Error("Manifest path is outside the checkout.");
            }
            copyTree(source, path.join(output, relative));
          }

          fs.writeFileSync(
            path.join(output, "release.json"),
            `${JSON.stringify({ schemaVersion: 1, appId, commit }, null, 2)}\n`,
            { encoding: "utf8", flag: "wx" },
          );
          fs.writeFileSync(path.join(output, ".nojekyll"), "", { flag: "wx" });
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the fixed artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy the fixed artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
